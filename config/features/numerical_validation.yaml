schema_version: "1.0.0"

feature:
  id: "numerical_validation"
  name: "Symbolic Mathematics & Numerical Verification Engine"
  enabled: true

engine:
  library: "sympy"
  timeout_per_expression_sec: 2.0
  allow_simplification: true
  verify_units: true

tolerance:
  relative_tolerance: 0.01   # 1% numerical deviation allowed
  absolute_tolerance: 1e-4
  significant_digits_check: false
