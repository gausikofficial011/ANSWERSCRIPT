schema_version: "1.0.0"

active_profile: "minimal_cpu"

profiles:
  minimal_cpu:
    name: "Minimal CPU (Laptop Safe)"
    description: "Designed for constrained systems with < 2GB free RAM and < 20GB free storage"
    max_ram_usage_mb: 1200
    max_disk_usage_mb: 1000
    device: "cpu"
    batch_size: 4
    enable_onnx_quantization: true

  balanced_cpu:
    name: "Balanced Multi-Core CPU"
    description: "Optimized for 12+ core CPUs with > 4GB free RAM"
    max_ram_usage_mb: 3000
    max_disk_usage_mb: 2500
    device: "cpu"
    batch_size: 8
    enable_onnx_quantization: true

  gpu_accelerated:
    name: "GPU Accelerated (CUDA/DirectML)"
    description: "Requires dedicated NVIDIA/AMD GPU with >= 6GB VRAM"
    max_ram_usage_mb: 6000
    max_disk_usage_mb: 8000
    device: "cuda"
    batch_size: 16
    enable_onnx_quantization: false

  research_experimental:
    name: "Research & Heavy Benchmarking"
    description: "Uncapped resources for TrOCR and LayoutLM fine-tuning experiments"
    max_ram_usage_mb: 12000
    max_disk_usage_mb: 25000
    device: "cpu"
    batch_size: 2
    enable_onnx_quantization: false

models:
  ocr:
    - id: "easyocr-crnn-latin"
      engine: "easyocr"
      type: "handwritten_printed"
      status: "installed"
      local_cache: "C:/Users/vaass/.EasyOCR/model"
      languages: ["en"]
      character_error_rate_baseline: 0.12
      latency_per_page_sec: 1.85
      is_default: true

    - id: "tesseract-ocr-eng"
      engine: "tesseract"
      type: "printed_baseline"
      status: "available_offline"
      languages: ["eng"]
      character_error_rate_baseline: 0.08
      latency_per_page_sec: 0.65
      is_default: false

  embeddings:
    - id: "all-MiniLM-L6-v2"
      source: "sentence-transformers/all-MiniLM-L6-v2"
      dimension: 384
      status: "available"
      profile_affinity: "minimal_cpu"
      download_size_mb: 80
      cosine_similarity_threshold: 0.72
      is_default: true

    - id: "paraphrase-multilingual-mpnet-base-v2"
      source: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
      dimension: 768
      status: "installed"
      local_cache: "C:/Users/vaass/.cache/huggingface/hub/models--sentence-transformers--paraphrase-multilingual-mpnet-base-v2"
      profile_affinity: "balanced_cpu"
      download_size_mb: 420
      cosine_similarity_threshold: 0.75
      is_default: false

  classical_ml:
    - id: "tfidf-ngram-integrity"
      framework: "scikit-learn"
      task: "plagiarism_candidate_retrieval"
      status: "installed"
      ngram_range: [1, 3]
      max_features: 10000
      is_default: true

    - id: "logreg-collusion-classifier"
      framework: "scikit-learn"
      task: "pairwise_similarity_scoring"
      status: "installed"
      checkpoint_path: "ml/models/plagiarism_v1.joblib"
      is_default: true

  mathematics:
    - id: "sympy-symbolic-verifier"
      framework: "sympy"
      task: "algebraic_equivalence_and_calculus"
      status: "installed"
      timeout_sec: 2.0
      is_default: true
