# =============================================================================
# Docker Compose — Test Environment
# Usage: docker-compose -f docker-compose.test.yml up --abort-on-container-exit
# =============================================================================

version: "3.9"

name: ai-eval-test

services:

  backend-test:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile.dev
    container_name: ai_eval_backend_test
    volumes:
      - ./backend:/app
      - test_uploads:/app/uploads
    environment:
      - APP_ENV=test
      - POSTGRES_HOST=db-test
      - POSTGRES_DB=ai_eval_test_db
      - POSTGRES_USER=ai_eval_test_user
      - POSTGRES_PASSWORD=test_password
      - DATABASE_URL=postgresql+asyncpg://ai_eval_test_user:test_password@db-test:5432/ai_eval_test_db
      - JWT_SECRET_KEY=test_secret_key_not_for_production
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=5
      - STORAGE_BASE_PATH=/app/uploads
      - OCR_GPU_ENABLED=false
      - LOG_LEVEL=WARNING
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - test_network
    command: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

  db-test:
    image: postgres:15-alpine
    container_name: ai_eval_db_test
    environment:
      POSTGRES_DB: ai_eval_test_db
      POSTGRES_USER: ai_eval_test_user
      POSTGRES_PASSWORD: test_password
    tmpfs:
      - /var/lib/postgresql/data   # In-memory for speed
    networks:
      - test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_eval_test_user -d ai_eval_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  test_uploads:
    driver: local

networks:
  test_network:
    driver: bridge
