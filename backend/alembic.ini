# =============================================================================
# Alembic Configuration
# =============================================================================

[alembic]
# Path to migration scripts
script_location = migrations

# Template for new migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in migration filenames
timezone = UTC

# Truncate slug to this length
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# The database URL is loaded dynamically via env.py → app.config
# Do NOT set sqlalchemy.url here; it is injected at runtime.

# ── Logging ──────────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
